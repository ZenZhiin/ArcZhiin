# =============================================================================
# ArcZhiin — Docker Compose
# Orchestrates all services for production deployment on the desktop hub.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # ArcZhiin Frontend (React + Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: arczhiin-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - arczhiin-net

  # ---------------------------------------------------------------------------
  # ArcZhiin Backend (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: arczhiin-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - .env:/app/.env:ro
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - HOME_ASSISTANT_URL=http://homeassistant:8123
      - DATABASE_PATH=/app/data/arczhiin.db
    depends_on:
      - ollama
    networks:
      - arczhiin-net

  # ---------------------------------------------------------------------------
  # Ollama (Local LLM with CUDA GPU)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: arczhiin-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - arczhiin-net

  # ---------------------------------------------------------------------------
  # Home Assistant
  # ---------------------------------------------------------------------------
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: arczhiin-homeassistant
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - ha-config:/config
    environment:
      - TZ=Asia/Kuala_Lumpur
    networks:
      - arczhiin-net

volumes:
  ollama-models:
  ha-config:

networks:
  arczhiin-net:
    driver: bridge
